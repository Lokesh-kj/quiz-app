<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Dev Quiz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .quiz-container {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    h1 { margin-bottom: 1.5rem; color: #333; }

    #question { font-size: 1.2rem; margin-bottom: 1rem; color: #444; }

    #answers { display: flex; flex-direction: column; gap: 0.6rem; }

    .answer-btn {
      padding: 0.7rem;
      border: 2px solid #667eea;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
    }

    .answer-btn:hover { background: #667eea; color: #fff; }
    .answer-btn.correct { background: #4caf50; color: #fff; border-color: #4caf50; }
    .answer-btn.wrong { background: #f44336; color: #fff; border-color: #f44336; }

    #score { margin-top: 1rem; font-weight: bold; }

    #next-btn {
      margin-top: 1rem;
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="quiz-container">
    <h1>Web Dev Quiz</h1>
    <div id="question-box">
      <p id="question">Loading...</p>
      <div id="answers"></div>
    </div>
    <p id="score">Score: 0</p>
    <button id="next-btn" class="hidden">Next Question</button>
  </main>

  <script>
    const questions = [
      {
        question: "What does HTML stand for?",
        answers: ["HyperText Markup Language", "Home Tool Markup Language", "Hyperlinks Text Mode Language"],
        correct: 0
      },
      {
        question: "Which property changes text color in CSS?",
        answers: ["font-style", "text-color", "color"],
        correct: 2
      },
      {
        question: "How do you declare a variable in modern JavaScript?",
        answers: ["let myVar", "variable myVar", "v myVar"],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const scoreEl = document.getElementById("score");
    const nextBtn = document.getElementById("next-btn");

    function showQuestion() {
      const q = questions[currentQuestion];
      questionEl.textContent = q.question;
      answersEl.innerHTML = "";
      nextBtn.classList.add("hidden");

      q.answers.forEach((answer, index) => {
        const btn = document.createElement("button");
        btn.textContent = answer;
        btn.classList.add("answer-btn");
        btn.addEventListener("click", () => selectAnswer(index, btn));
        answersEl.appendChild(btn);
      });
    }

    function selectAnswer(index, btn) {
      const q = questions[currentQuestion];
      const buttons = answersEl.querySelectorAll("button");

      buttons.forEach(b => b.disabled = true);

      if (index === q.correct) {
        btn.classList.add("correct");
        score++;
      } else {
        btn.classList.add("wrong");
        buttons[q.correct].classList.add("correct");
      }

      scoreEl.textContent = "Score: " + score;
      nextBtn.classList.remove("hidden");
    }

    nextBtn.addEventListener("click", () => {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        questionEl.textContent = "Quiz finished! Final score: " + score + "/" + questions.length;
        answersEl.innerHTML = "";
        nextBtn.classList.add("hidden");
      }
    });

    showQuestion();
  </script>
</body>
</html>
